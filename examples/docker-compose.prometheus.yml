# Optional Prometheus + Grafana observability overlay for
# docker-compose.split.yml.
#
# docker compose -f examples/docker-compose.split.yml \
#   -f examples/docker-compose.prometheus.yml up -d --build
#
# Prometheus and Grafana are published on the host for operator use. The
# broker's metrics listener is only exposed to the internal Compose network;
# it has no host port.
services:
  broker:
    environment:
      OTEL_METRICS_EXPORTER: prometheus
      CRATE_METRICS_ADDR: 0.0.0.0:9464
    expose:
      - "9464"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/provisioning/dashboards/crate-html.yml:/etc/grafana/provisioning/dashboards/crate-html.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-data:
