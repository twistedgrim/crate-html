# A local S3-compatible server (rustfs) plus a crated configured to use it, for
# developing and testing the object-storage backend without touching a cloud
# account.
#
#   docker compose -f examples/docker-compose.rustfs.yml up -d
#
# Note what is NOT here: crated has no volume for /data. That is the point —
# with storage_backend=s3 the daemon holds no durable local state, so the
# container filesystem can be thrown away and every site survives in the bucket.
#
# The credentials below are development defaults. Do not reuse them anywhere
# that matters.
services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: crate-rustfs
    restart: unless-stopped
    ports:
      - "9100:9000"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data

  # Creates the bucket once, then exits. crated deliberately never creates its
  # own bucket, so a typo in the name fails loudly instead of silently starting
  # with an empty one.
  createbucket:
    image: minio/mc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/crate;
      echo 'bucket ready';
      "

  crated:
    build:
      context: ..
      dockerfile: Dockerfile
    image: crate-html:dev
    container_name: crated-s3
    restart: unless-stopped
    depends_on:
      - createbucket
    ports:
      - "7777:7777"
    environment:
      CRATE_STORAGE_BACKEND: s3
      CRATE_S3_ENDPOINT: http://rustfs:9000
      CRATE_S3_BUCKET: crate
      CRATE_S3_ACCESS_KEY: rustfsadmin
      CRATE_S3_SECRET_KEY: rustfsadmin
      CRATE_BASE_URL: http://localhost:7777
      # Pin the root token: config.yaml is not persisted here, so without this
      # every restart would mint a new random one. Named tokens minted through
      # /api/tokens live in the bucket and need no volume.
      CRATE_TOKEN: dev-root-token-change-me
    # No volumes at all. Sites and named tokens are in the bucket, so this
    # container's filesystem is disposable — `docker compose rm crated` and
    # start it again, and nothing is lost.
    #
    # For the hybrid mode most deployments actually want — bucket-backed
    # content, but no root-token secret to manage — drop CRATE_TOKEN above and
    # mount a small config volume instead:
    #
    #   volumes:
    #     - crate-config:/config
    #
    # (and add `crate-config:` to the volumes block at the bottom). The root
    # token is then generated once and persists across restarts, exactly as in
    # the default local setup. See docs/s3-storage.md.

volumes:
  rustfs-data:
